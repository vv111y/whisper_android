// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    dependencies {
        classpath('com.android.tools.build:gradle:8.9.1')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
    }

    repositories {
        google()
        mavenCentral()
    }
}

//plugins {
//    id 'com.android.application' version '8.0.2' apply false
//    id 'com.android.library' version '8.0.2' apply false
//}

// Convenience aliases for local CI runs
tasks.register("localCi") {
    group = "verification"
    description = "Assemble debug, run unit tests and lint (no device required)."
    dependsOn(":app:assembleDebug", ":app:testDebugUnitTest", ":app:lintDebug")
}

tasks.register("localCiConnected") {
    group = "verification"
    description = "Run connected Android tests on a device/emulator (screen must be awake)."
    dependsOn(":app:connectedDebugAndroidTest")
}

// Convenience task to run the auto-tuner and produce build/auto_tune/best_config.json
tasks.register("tuneVad") {
    group = "verification"
    description = "Run auto-tuning scenarios to suggest VAD pipeline tunables. Outputs build/auto_tune/best_config.json"
    doLast {
        // Run the tuner within the app module
        exec {
            commandLine "./gradlew", "-q", "app:testDebugUnitTest", "-Dtune=true"
        }

        // Normalize output location: copy from app/build/... to root build/...
        def srcApp = file("app/build/auto_tune/best_config.json")
        def dstDir = file("build/auto_tune")
        if (srcApp.exists()) {
            dstDir.mkdirs()
            copy {
                from srcApp
                into dstDir
            }
            println("best_config.json copied to ${new File(dstDir, 'best_config.json').path}")
        } else {
            def srcRoot = file("build/auto_tune/best_config.json")
            if (srcRoot.exists()) {
                println("best_config.json found at ${srcRoot.path}")
            } else {
                println("Tuner ran, but best_config.json was not found. Ensure the auto-tuning test emitted it.")
            }
        }
    }
}

// Generate an index of Specstory transcripts under .specstory/history
tasks.register("generateSpecstoryIndex") {
    group = "documentation"
    description = "Generate .specstory/INDEX.generated.md with links to transcripts in .specstory/history."
    doLast {
        def historyDir = file(".specstory/history")
        if (!historyDir.exists()) {
            println("No .specstory/history directory found; nothing to generate.")
            return
        }
        def mdFiles = historyDir.listFiles({ d, name -> name.toLowerCase().endsWith('.md') } as FilenameFilter)
        if (mdFiles == null || mdFiles.length == 0) {
            println("No markdown transcripts found in .specstory/history.")
            return
        }
        mdFiles = mdFiles.sort { a, b -> b.name <=> a.name } // newest first by name
        def out = new StringBuilder()
        out.append("# Specstory Index (generated)\n\n")
        out.append("Generated by ./gradlew generateSpecstoryIndex\n\n")
        out.append("## Files\n\n")
        mdFiles.each { f ->
            out.append("- [").append(f.name).append("](history/").append(f.name).append(")\n")
        }
        def outFile = file(".specstory/INDEX.generated.md")
        outFile.parentFile.mkdirs()
        outFile.text = out.toString()
        println("Wrote ${outFile.path}")
    }
}

// Run ASR-in-the-loop tuning via connected tests and collect artifact
tasks.register("tuneAsr") {
    group = "verification"
    description = "Run ASR tuning scenarios (androidTest) with -DasrTune=true and collect build/asr_tune/best_config_asr.json"
    doLast {
        // Allow overriding manifest and audio dir
        def asrManifest = project.findProperty('asr.manifest') ?: 'docs/data/tuning_manifest.json'
        def asrAudioDir = project.findProperty('asr.audioDir') ?: ''

        // Pass arguments to instrumentation via testInstrumentationRunnerArguments
        def args = [
                "./gradlew", "-q", "app:connectedDebugAndroidTest",
                "-Pandroid.testInstrumentationRunnerArguments.asrTune=true",
                "-Pandroid.testInstrumentationRunnerArguments.asr.manifest=${asrManifest}"
        ]
        if (asrAudioDir) { args.add("-Pandroid.testInstrumentationRunnerArguments.asr.audioDir=${asrAudioDir}") }
        exec { commandLine args }

        // Pull artifact from device external files dir to module build folder
        def appId = 'com.whispertflite'
        def devicePath = "/sdcard/Android/data/${appId}/files/asr_tune/best_config_asr.json"
        def appOutDir = file("app/build/asr_tune")
        appOutDir.mkdirs()
        try {
            exec { commandLine "adb", "pull", devicePath, new File(appOutDir, 'best_config_asr.json').path }
        } catch (Exception e) {
            println("Warning: Failed to pull artifact from device: ${e.message}")
        }

        // Normalize to root build folder
        def srcApp = file("app/build/asr_tune/best_config_asr.json")
        def dstDir = file("build/asr_tune")
        dstDir.mkdirs()
        if (srcApp.exists()) {
            copy { from srcApp; into dstDir }
            println("best_config_asr.json copied to ${new File(dstDir, 'best_config_asr.json').path}")
        } else {
            println("ASR tuner ran, but best_config_asr.json was not found. Ensure the androidTest wrote it to external files.")
        }
    }
}

// Bundle curated config into app assets (copy configs/*/current.json)
tasks.register("bundleCuratedConfig") {
    group = "build"
    description = "Copy configs/*/current.json into app/src/main/assets/configs/current.json for bundling"
    doLast {
        def srcAsr = file("configs/asr/current.json")
        def srcVad = file("configs/vad/current.json")
        def merged = new groovy.json.JsonSlurper().parseText('{}')
        if (srcAsr.exists()) {
            def asrObj = new groovy.json.JsonSlurper().parse(srcAsr)
            merged.asr = asrObj
        }
        if (srcVad.exists()) {
            def vadObj = new groovy.json.JsonSlurper().parse(srcVad)
            merged.vad = vadObj
        }
        def outDir = file("app/src/main/assets/configs")
        outDir.mkdirs()
        def outFile = new File(outDir, "current.json")
        outFile.text = new groovy.json.JsonBuilder(merged).toPrettyString()
        println("Wrote bundled config to ${outFile.path}")
    }
}
